name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Build
        run: npm run build

      - name: Checkout publish target
        uses: actions/checkout@v4
        with:
          repository: FallingMY/FallingMY.github.io
          token: ${{ secrets.PUBLISH_TOKEN }}
          path: out

      - name: Publish
        run: |
          set -euo pipefail
          # Clean rebuild: replace every generated file, keep .git and hand-made sub-projects.
          rsync -a --delete --exclude '.git' --exclude 'puzzle' public/ out/
          touch out/.nojekyll
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Deploy myblog@${GITHUB_SHA:0:7}"
          git push
